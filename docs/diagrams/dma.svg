<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">DMA ownership design</title><desc id="desc">Design only, not live QNX evidence. Validate host memory range then Transfer ownership to device then Bounded device buffer then Complete before reuse or release</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#6650a4"/></marker></defs><rect width="720" height="420" fill="#f8fafc"/><text x="24" y="32" font-size="22" font-family="sans-serif" fill="#181c1e">DMA ownership design</text><text x="24" y="58" font-size="14" font-family="sans-serif" fill="#654b10">Design only · not a live QNX execution</text><rect x="80" y="78" width="560" height="52" rx="5" fill="#eee8ff" stroke="#6650a4"/><text x="360" y="110" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#181c1e">Validate host memory range</text><path d="M360,130 L360,154" stroke="#6650a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="156" width="560" height="52" rx="5" fill="#eee8ff" stroke="#6650a4"/><text x="360" y="188" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#181c1e">Transfer ownership to device</text><path d="M360,208 L360,232" stroke="#6650a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="234" width="560" height="52" rx="5" fill="#eee8ff" stroke="#6650a4"/><text x="360" y="266" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#181c1e">Bounded device buffer</text><path d="M360,286 L360,310" stroke="#6650a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="312" width="560" height="52" rx="5" fill="#eee8ff" stroke="#6650a4"/><text x="360" y="344" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#181c1e">Complete before reuse or release</text></svg>
